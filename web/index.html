<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff">
  <title>Scanner</title>
  <link rel="stylesheet" href="panel.css">
  <script src="panel.js" type="module"></script>
</head>
<body>
  <main class="radio" aria-label="Scanner front panel">
    <div class="photo-plane">
      <img class="panel-photo" src="panel.png" alt="" draggable="false" width="1629" height="965">

      <button type="button" class="key" data-key="hold" aria-label="Hold" style="--x:99;--y:254;--w:145;--h:96"></button>
      <button type="button" class="key" data-key="up" aria-label="Up" style="--x:278;--y:251;--w:138;--h:100"></button>
      <button type="button" class="key" data-key="down" aria-label="Down" style="--x:454;--y:251;--w:143;--h:100"></button>
      <button type="button" class="key" data-key="private" aria-label="Private" style="--x:98;--y:389;--w:147;--h:69"></button>
      <button type="button" class="key" data-key="emg" aria-label="EMG" style="--x:275;--y:389;--w:148;--h:69"></button>
      <button type="button" class="key" data-key="frn" aria-label="FRN/PMR" style="--x:450;--y:389;--w:151;--h:69"></button>
      <button type="button" class="key" data-key="close" aria-label="Close Call" style="--x:98;--y:491;--w:149;--h:73"></button>
      <button type="button" class="key" data-key="air" aria-label="Air/Marine" style="--x:275;--y:491;--w:149;--h:73"></button>
      <button type="button" class="key" data-key="cb" aria-label="CB AM/FM" style="--x:450;--y:491;--w:152;--h:73"></button>
      <button type="button" class="key" data-key="search" aria-label="Search" style="--x:660;--y:493;--w:134;--h:98"></button>
      <button type="button" class="key" data-key="lock" aria-label="L/O" style="--x:834;--y:495;--w:135;--h:97"></button>
      <button type="button" class="key" data-key="band" aria-label="Band/Step" style="--x:1015;--y:495;--w:133;--h:97"></button>
      <button type="button" class="key" data-key="prog" aria-label="Prog" style="--x:1188;--y:494;--w:135;--h:98"></button>

      <div class="dial" data-knob="squelch" role="slider" tabindex="0" aria-label="SQ" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" style="--x:1405;--y:210;--w:164;--h:164;--cap-x:1413;--cap-y:218;--cap-size:148"></div>
      <div class="dial" data-knob="volume" role="slider" tabindex="0" aria-label="Volume/Clock" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="Clock standby" style="--x:1405;--y:442;--w:164;--h:164;--cap-x:1413;--cap-y:450;--cap-size:148"></div>

      <div id="lcd" class="lcd" role="img" tabindex="0" aria-label="Scanner display" aria-description="Scroll to tune, or type a frequency in MHz and press Enter.">
        <div class="lcd-banks" aria-hidden="true">
          <span data-lcd="PVT">PVT</span><span data-lcd="EMG">EMG</span><span data-lcd="FRN">FRN</span><span data-lcd="PMR">PMR</span><span data-lcd="AIR">AIR</span><span data-lcd="MRN">MRN</span><span data-lcd="CB">CB</span><span data-lcd="AM">AM</span><span data-lcd="NFM">NFM</span>
        </div>
        <div class="lcd-readout" aria-hidden="true">
          <div class="lcd-channel"><span data-lcd="CH">CH</span><div id="channel"></div></div>
          <div id="display"></div>
        </div>
        <div class="lcd-status" aria-hidden="true">
          <span class="close-icon" data-lcd="CLOSE">⊕</span><span data-lcd="HOLD">HOLD</span><span data-lcd="SCAN">SCAN</span><span data-lcd="SEARCH">SEARCH</span><span data-lcd="▲">▲</span><span data-lcd="▼">▼</span><span data-lcd="T">T</span><span data-lcd="L/O">L/O</span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
